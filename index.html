<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주탐험</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚀</text></svg>">
<style>
  /* ══════════════════════════════════════════════════════
     화면. 규칙은 engine.js에 있고 여기는 보여주는 일만 함
     ══════════════════════════════════════════════════════ */
  :root{
    --bg:transparent; --panel:rgba(26,33,49,.74); --panel2:rgba(38,46,66,.9); --line:#3b455e;
    --fg:#eef2f9; --dim:#a3aec4; --o2:#6fdcff; --bad:#ff7b7b; --good:#6ee79a;
    --common:#a8b3c2; --uncommon:#61aeff; --rare:#c08cff; --legend:#ffbe3d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 배경 우주. 성운은 radial-gradient, 별은 box-shadow로 찍고
        두 장을 이어 붙여 무한 스크롤시킴 (rAF 안 돌려서 공짜) */
  #space{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:
      radial-gradient(ellipse 62% 48% at 14% 16%, rgba(84,132,255,.40), transparent 62%),
      radial-gradient(ellipse 58% 44% at 86% 74%, rgba(196,86,255,.32), transparent 62%),
      radial-gradient(ellipse 78% 48% at 48% 112%, rgba(0,214,236,.28), transparent 62%),
      radial-gradient(ellipse 44% 34% at 72% 4%,  rgba(64,255,222,.16), transparent 62%),
      radial-gradient(ellipse 90% 70% at 50% 50%, rgba(40,58,120,.35), transparent 70%),
      #0b1226;
  }
  .slayer{position:absolute; left:0; top:0; width:2200px; height:2000px; animation:starfall linear infinite}
  .slayer span{position:absolute; left:0; border-radius:50%; background:transparent}
  @keyframes starfall{ from{transform:translateY(0)} to{transform:translateY(-2000px)} }

  /* 멀리 걸린 행성 하나. 화면 구석을 채워주는 용도 */
  #space .planet{
    position:absolute; right:-150px; bottom:-190px; width:470px; height:470px; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #5b8fd6, #2b4a86 52%, #16224a 80%);
    box-shadow:inset -34px -30px 80px rgba(0,0,0,.5), 0 0 140px rgba(110,170,255,.35);
    opacity:.85;
  }

  /* 떠다니는 것들 — 가로지르기(바깥)와 회전(안쪽)을 나눠 걸어서 겹침 */
  .drift{
    position:absolute; left:0; will-change:transform;
    animation-name:cross; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  .tumble{animation:tumble linear infinite; will-change:transform}
  @keyframes cross{
    from{transform:translate3d(-20vw, 0, 0)}
    to  {transform:translate3d(120vw, var(--dy, 0), 0)}
  }
  @keyframes tumble{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* 가장자리만 살짝 눌러줌 — 너무 어둡게 덮으면 우주가 안 보임 */
  #space::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 82% 72% at 50% 45%, transparent 55%, rgba(4,7,18,.55) 100%);
  }

  #app{max-width:1180px; margin:0 auto; padding:16px 16px 40px}

  header{margin-bottom:14px}
  .titlebar{display:flex; align-items:center; gap:14px; padding:0 4px 10px}
  .titlebar h1{font-size:17px; margin:0; letter-spacing:-.5px; text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .titlebar h1 small{display:block; font-size:10px; color:var(--dim); font-weight:400; letter-spacing:0}
  .mini{display:flex; flex-direction:column; align-items:flex-end}
  .mini span{font-size:10px; color:var(--dim)}
  .mini b{font-size:15px; font-variant-numeric:tabular-nums}
  .mini.best b{color:var(--good)}
  #muteBtn{padding:6px 10px; font-size:14px; line-height:1}
  #guideBtn{padding:6px 12px; font-size:12px; font-weight:800; border-color:rgba(186,124,255,.6)}
  .spacer{flex:1}

  /* ── 왼쪽 계기판. 구역이 제일 크고 아래로 갈수록 부차적 */
  .gauges{display:flex; flex-direction:column; gap:10px}
  .g{
    background:linear-gradient(180deg,rgba(36,26,82,.8),rgba(20,14,48,.85));
    border:1px solid rgba(186,124,255,.35); border-radius:12px;
    padding:10px 13px 11px; backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 16px rgba(120,80,220,.16);
  }
  .g span{display:block; font-size:10px; letter-spacing:1.2px; color:#a394de; margin-bottom:2px}
  .g b{font-size:28px; line-height:1.02; font-variant-numeric:tabular-nums; letter-spacing:-1px}
  .g.big{padding:14px 13px 16px}
  .g.big span{font-size:11px}
  .g.big b{font-size:58px; color:#fff; text-shadow:0 0 10px rgba(255,255,255,.5), 0 0 30px rgba(120,190,255,.7)}
  .g.o2 b{color:var(--o2); text-shadow:0 0 14px rgba(111,220,255,.6)}
  .g.o2 b::after{content:' O₂'; font-size:12px; letter-spacing:0; opacity:.55}
  .g.cost b{color:var(--bad); text-shadow:0 0 14px rgba(255,123,123,.5)}
  .g em{font-style:normal; font-size:10px; color:var(--legend); display:block; margin-top:3px}
  .g .dots{display:flex; gap:5px; margin-top:8px; flex-wrap:wrap}
  .g .dots i{width:10px; height:10px; border-radius:50%; background:#332a5e; display:block}
  .g .dots i.on{background:var(--o2); box-shadow:0 0 8px rgba(111,220,255,.8)}

  /* 산소가 빠져나가는 순간 — 놓치면 안 되는 장면이라 화면째로 흔듦 */
  body.draining .g.o2{
    border-color:var(--bad);
    background:linear-gradient(180deg,#3a0f16,#1a0a20);
    animation:shake .42s ease-in-out infinite;
  }
  body.draining .g.o2 b{color:var(--bad); text-shadow:0 0 18px rgba(255,123,123,.75)}
  body.draining .life b{color:var(--bad); text-shadow:0 0 24px rgba(255,123,123,.45)}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)}
    50%{transform:translateX(3px)}  75%{transform:translateX(-2px)}
  }

  /* 좌우 열 폭이 같아야 슬롯머신이 화면 정중앙에 온다.
     오른쪽 열은 레버가 도는 차선 겸 화물칸 버튼 자리 */
  main{display:grid; grid-template-columns:212px minmax(0,1fr) 212px; gap:14px; column-gap:18px; align-items:start}
  @media (max-width:1180px){ main{grid-template-columns:176px minmax(0,1fr) 176px; gap:12px} }
  @media (max-width:980px){ main{grid-template-columns:1fr} }

  /* ── 슬롯머신 캐비닛 ─────────────────────────────
     네온 튜브 외곽 + 아치형 간판 + 릴 창 + 콘솔 + 배출구.
     캔버스만 덩그러니 놓으면 판이 아니라 표처럼 보임 */
  .cabinet{
    position:relative;   /* 레버 차선은 오른쪽 열(212px + 간격 18px)이 맡는다 */
    border-radius:64px 64px 20px 20px; padding:0 0 0;
    background:
      linear-gradient(180deg, rgba(120,74,220,.40), rgba(46,28,96,.72) 22%, rgba(18,14,44,.92)),
      var(--panel);
    border:2px solid rgba(186,124,255,.55);
    box-shadow:
      inset 0 0 0 4px rgba(58,215,255,.16),
      inset 0 2px 0 rgba(255,255,255,.18),
      inset 0 -30px 60px rgba(0,0,0,.5),
      0 0 26px rgba(176,108,255,.45),
      0 0 70px rgba(58,215,255,.18),
      0 22px 50px rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
  }
  /* 외곽을 한 겹 더 두른 네온 튜브 */
  .cabinet::before{
    content:''; position:absolute; inset:-9px; border-radius:72px 72px 26px 26px;
    border:2px solid rgba(255,95,210,.35); pointer-events:none;
    box-shadow:0 0 22px rgba(255,95,210,.35), inset 0 0 22px rgba(255,95,210,.12);
  }

  /* 아치형 간판 */
  .topper{position:relative; padding:16px 22px 12px; text-align:center}
  .topper .bulbrow{
    position:absolute; left:26px; right:26px; top:6px; height:9px; border-radius:5px;
    background:repeating-linear-gradient(90deg,
      rgba(255,225,140,.95) 0 5px, transparent 5px 17px);
    box-shadow:0 0 12px rgba(255,205,90,.6);
    animation:bulbs 1.1s linear infinite;
  }
  @keyframes bulbs{ to{ background-position:17px 0 } }
  .topper .sign{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:10px}
  .topper .deco{font-size:26px; filter:drop-shadow(0 0 10px rgba(120,200,255,.7))}
  .topper h2{
    margin:0; font-size:24px; font-weight:900; line-height:.98; letter-spacing:5px;
    color:#eafaff;
    text-shadow:
      0 0 6px #fff, 0 0 16px #6fdcff, 0 0 34px #3ad7ff,
      0 0 54px rgba(176,108,255,.9);
  }
  .topper h2 b{
    display:block; font-size:29px; letter-spacing:7px; color:#ffe6ff;
    text-shadow:0 0 6px #fff, 0 0 18px #ff5fd2, 0 0 40px #b06cff;
  }

  /* 릴 창 — 네온 베젤 안에 유리 */
  .machine{padding:4px 18px 12px}
  .window{
    position:relative; flex:1; min-width:0; border-radius:16px; padding:10px;
    background:linear-gradient(180deg,#4b3a8e,#241a52 55%,#150f36);
    border:1px solid rgba(186,124,255,.5);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.22),
      inset 0 -3px 0 rgba(0,0,0,.45),
      0 0 20px rgba(120,80,220,.45),
      0 8px 22px rgba(0,0,0,.5);
  }
  .window .glass{
    position:absolute; inset:10px; border-radius:9px; pointer-events:none;
    background:linear-gradient(118deg,
      rgba(255,255,255,.15) 0%, rgba(255,255,255,.04) 26%,
      transparent 46%, transparent 100%);
    box-shadow:inset 0 0 46px rgba(0,0,0,.55);
  }
  canvas{width:100%; height:auto; display:block; border-radius:9px; touch-action:manipulation}

  /* 콘솔 — 버튼과 7세그먼트 디스플레이 */
  .console{
    margin:0 18px; padding:11px 13px; border-radius:14px;
    background:linear-gradient(180deg,#241a52,#140e30);
    border:1px solid rgba(186,124,255,.4);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.6), 0 0 16px rgba(120,80,220,.25);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .pill{
    border-radius:999px; padding:9px 17px; font-size:13px; font-weight:800; letter-spacing:.5px;
    border:1px solid rgba(255,255,255,.28); flex:none;
  }
  .pill.cyan{background:linear-gradient(180deg,#2fd0ea,#1183ad); box-shadow:0 0 14px rgba(58,215,255,.5), inset 0 1px 0 rgba(255,255,255,.5)}
  .pill.pink{background:linear-gradient(180deg,#ff6fc4,#c02c8e); box-shadow:0 0 14px rgba(255,95,210,.45), inset 0 1px 0 rgba(255,255,255,.45)}
  .pill:hover:not(:disabled){filter:brightness(1.14)}

  /* 7세그먼트 흉내 — 꺼진 획을 흐리게 깔고 그 위에 실제 값을 겹침 */
  .seg{
    position:relative; padding:9px 11px 8px; border-radius:8px; text-align:right;
    background:linear-gradient(180deg,#0a0512,#160c22);
    border:1px solid rgba(186,124,255,.35);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.9), 0 0 10px rgba(255,60,60,.12);
    font-family:"Courier New",ui-monospace,monospace; font-weight:700;
    font-variant-numeric:tabular-nums; letter-spacing:3px; line-height:1;
  }
  .seg i{font-style:normal; color:rgba(255,70,70,.13)}     /* 꺼진 획 */
  .seg b{
    position:absolute; top:50%; transform:translateY(-50%);
    color:#ff4b4b; text-shadow:0 0 7px rgba(255,60,60,.95), 0 0 18px rgba(255,40,40,.55);
  }
  .seg u{text-decoration:none; color:#ff8a8a; font-size:11px; letter-spacing:0; margin-left:2px}
  .seg.spd{font-size:19px; min-width:78px}
  .seg.spd b{right:27px}
  .seg.score{font-size:20px; padding-top:16px; min-width:136px; flex:1}
  .seg.score span{
    position:absolute; left:11px; top:4px; font-family:inherit;
    font-size:8px; letter-spacing:2px; color:#7a6bb5; text-shadow:none;
  }
  .seg.score b{right:11px}

  /* 하단 배출구 */
  .payout{
    position:relative;
    margin:12px 18px 16px; padding:9px 14px 11px; border-radius:12px;
    background:linear-gradient(180deg,#191140,#0a0722);
    border:1px solid rgba(186,124,255,.32);
    display:flex; align-items:center; gap:12px;
  }
  .payout .coinin{
    font-size:8px; letter-spacing:1.6px; color:#8f7fd0; border:1px solid #4b3c8c;
    border-radius:4px; padding:3px 6px; white-space:nowrap;
  }
  /* PAYOUT 자리를 순도 게이지로 씀 — 전역 규칙이라 늘 보여야 함 */
  .payout .purbar{
    flex:1; height:16px; border-radius:8px; overflow:hidden;
    background:linear-gradient(180deg,#05030f,#120c2c);
    box-shadow:inset 0 5px 10px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08);
  }
  .payout .purbar i{
    display:block; height:100%; width:0;
    background:linear-gradient(90deg,#2fd0ea,#b06cff 55%,#ffbe3d);
    box-shadow:0 0 12px rgba(176,108,255,.7);
    transition:width .32s cubic-bezier(.2,.85,.3,1);
  }
  /* 스핀마다 동전 하나가 투입구로 떨어진다 */
  .payout .coin{
    position:absolute; left:26px; top:-30px; width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff6c4, #ffc43d 52%, #9c6a08);
    box-shadow:0 0 12px rgba(255,196,61,.9), inset 0 -3px 5px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; z-index:2;
  }
  .payout.drop .coin{animation:coinDrop .42s cubic-bezier(.45,0,.9,.55) forwards}
  @keyframes coinDrop{
    0%  {opacity:0; transform:translateY(-16px) scaleX(1)}
    18% {opacity:1; transform:translateY(-2px)  scaleX(.35)}
    45% {opacity:1; transform:translateY(16px)  scaleX(1)}
    72% {opacity:1; transform:translateY(30px)  scaleX(.3)}
    100%{opacity:0; transform:translateY(38px)  scaleX(.8)}
  }
  .payout.drop .coinin{
    color:#ffe6a6; border-color:#8a6a1c;
    box-shadow:0 0 14px rgba(255,196,61,.55);
    transition:none;
  }
  .payout .coinin{transition:color .5s, border-color .5s, box-shadow .5s}

  .payout .paylabel{
    font-size:11px; font-weight:800; letter-spacing:1px; color:#ffd7f2;
    text-shadow:0 0 10px rgba(255,95,210,.85), 0 0 22px rgba(255,95,210,.5);
    white-space:nowrap; font-variant-numeric:tabular-nums; min-width:104px; text-align:right;
  }
  .payout .paylabel b{color:#fff2a8; text-shadow:0 0 12px rgba(255,200,60,.9)}
  @media (max-width:640px){
    .cabinet{border-radius:40px 40px 16px 16px}
    .console{justify-content:center}
  }

  /* ── 레버. 기계 오른쪽 옆구리에 달려 바깥으로 삐져나온다.
     축을 중심으로 호를 그리며 내려간다 — 실제 슬롯머신 레버가 그렇고,
     수직으로만 미끄러지면 레버가 아니라 핀으로 보임.
     대신 움직임은 전부 "당기는 방향(+)"으로만 — 음수로도 흔들리면 딸랑거림 */
  .lever{
    position:absolute; right:-68px; top:124px; width:96px; height:318px;
    cursor:pointer; user-select:none; z-index:5;
  }
  .lever .trail{                                  /* 노브가 지나갈 호 궤적 */
    position:absolute; left:50%; bottom:46px; width:280px; height:280px;
    margin-left:-140px; margin-bottom:-140px; border-radius:50%;
    border:2px dashed transparent;
    border-right-color:rgba(255,110,110,.26);
    pointer-events:none; transition:border-right-color .2s;
  }
  .lever:hover:not(.off) .trail{border-right-color:rgba(255,110,110,.55)}
  .lever.pulled .trail{border-right-color:rgba(255,150,150,.9)}

  .lever .arm{                                    /* 축(맨 아래)을 원점으로 회전 */
    position:absolute; left:50%; margin-left:-25px; bottom:46px; width:50px; height:160px;
    transform-origin:50% 100%;
    transform:rotate(18deg);          /* 쉴 땐 오른쪽 위를 향해 비스듬히 */
    transition:transform .42s cubic-bezier(.18,1.7,.45,1);   /* 놓으면 튕겨 올라옴 */
    z-index:1;
  }
  .lever .shaft{
    position:absolute; left:50%; margin-left:-9px; top:34px; bottom:0; width:18px;
    background:linear-gradient(90deg,#3c4468,#f2f7ff 36%,#9fb0d8 62%,#39415f);
    border-radius:9px; box-shadow:0 2px 8px rgba(0,0,0,.55);
  }
  .lever .knob{
    position:absolute; left:0; top:0; width:50px; height:50px; border-radius:50%;
    background:radial-gradient(circle at 33% 27%, #ffc2c2, #ff4b4b 46%, #b81f1f 76%, #6d0f0f);
    box-shadow:
      0 0 20px rgba(255,70,70,.85), 0 0 46px rgba(255,60,60,.4),
      0 8px 18px rgba(0,0,0,.6), inset 0 -6px 12px rgba(0,0,0,.4),
      inset 0 4px 9px rgba(255,255,255,.5);
    cursor:grab; transition:transform .12s;
  }
  .lever:active .knob{cursor:grabbing}
  .lever.pulled .knob{transform:scale(.94)}

  .lever .pivot{                                  /* 축 브래킷 — 팔이 여기 물려 돈다 */
    position:absolute; left:50%; margin-left:-22px; bottom:24px; width:44px; height:44px;
    background:linear-gradient(180deg,#6a5bb0,#241a52);
    border:1px solid rgba(200,150,255,.6); border-radius:12px; z-index:2;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 5px 12px rgba(0,0,0,.55),
               0 0 16px rgba(150,100,240,.35);
  }
  .lever .pivot::after{
    content:''; position:absolute; left:50%; top:14px; margin-left:-7px;
    width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #e6ecfa, #6d799a 70%);
    box-shadow:inset 0 -1px 3px rgba(0,0,0,.6);
  }
  .lever .hint{
    position:absolute; bottom:2px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:700; letter-spacing:1.5px; color:#8f7fd0;
  }

  .lever:hover:not(.off) .arm{transform:rotate(28deg)}
  .lever.pulled .arm{
    transform:rotate(50deg);
    transition:transform .1s cubic-bezier(.5,0,.9,.6);        /* 내려갈 땐 확 */
  }

  /* 첫 판에는 주기적으로 당기는 방향으로만 까딱 */
  .lever.fresh .arm{animation:leverNudge 2.2s cubic-bezier(.4,0,.3,1) infinite}
  .lever.fresh .hint{color:#ff8a8a; animation:guideBlink 1.4s ease-in-out infinite}
  @keyframes guideBlink{ 0%,100%{opacity:.45} 45%{opacity:1} }
  @keyframes leverNudge{
    0%,58%{transform:rotate(18deg)}
    70%{transform:rotate(40deg)}
    80%{transform:rotate(24deg)}
    90%{transform:rotate(33deg)}
    100%{transform:rotate(18deg)}
  }
  .lever.fresh:hover .arm, .lever.pulled .arm{animation:none}
  /* 스핀 중엔 못 당기지만 사라지진 않게. opacity를 깎으면 없어진 걸로 보임 */
  .lever.off{pointer-events:none; filter:brightness(.72) saturate(.7)}
  @media (max-width:1180px){ .lever{right:-58px; transform:scale(.84); transform-origin:top left} }
  @media (max-width:980px){ .lever{position:static; width:100%; height:170px; margin:0 auto 6px} }

  button{
    font:inherit; font-weight:600; color:var(--fg); cursor:pointer;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px 16px; transition:.12s;
  }
  button:hover:not(:disabled){background:#39435c; border-color:#4e5a78}

  #speedBtn{min-width:56px}

  .side{display:flex; flex-direction:column; gap:14px}
  .cargotoggle{
    display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    border-radius:12px; padding:12px 14px; font-size:13px; font-weight:800;
    background:linear-gradient(180deg,rgba(36,26,82,.9),rgba(20,14,48,.9));

  }

    border-radius:999px; padding:3px 9px;
  }

  /* 화물칸 서랍 — 오른쪽에서 밀려 나온다 */
  .drawer{
    position:fixed; right:0; top:0; bottom:0; width:min(360px, 86vw); z-index:40;
    display:flex; flex-direction:column; padding:16px 16px 20px;

  .drawer .deck{max-height:none; flex:1; align-content:flex-start}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; backdrop-filter:blur(10px)}
  .card h2{font-size:12px; color:var(--dim); margin:0 0 9px; font-weight:600; letter-spacing:.3px}
  .deck{display:flex; flex-wrap:wrap; gap:8px; max-height:60vh; overflow-y:auto}
  .chip{
    display:flex; align-items:center; gap:4px; background:var(--panel2);

    line-height:1;

  .chip i{font-style:normal; font-size:12px; font-weight:700; color:#c7d0e4; font-variant-numeric:tabular-nums}
  .chip u{text-decoration:none; font-size:10px; font-weight:700; color:var(--legend)}

  #log{font-size:11px; color:var(--dim); line-height:1.7; max-height:290px; overflow-y:auto; font-variant-numeric:tabular-nums}
  #log .hl{color:var(--fg)}
  #log .plus{color:var(--good)}
  #log .minus{color:var(--bad)}

  /* 오버레이 — 심볼 선택 / 정비 / 정산 / 게임오버 */
  #overlay{
    position:fixed; inset:0; background:rgba(6,10,22,.82); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
    opacity:0; transition:opacity .2s ease;
  }

  #overlay.show{opacity:1}
  .modal{
    background:rgba(26,33,49,.96); border:1px solid var(--line); border-radius:16px;
    padding:22px; max-width:800px; width:100%; text-align:center;
    opacity:0; transform:translateY(22px) scale(.97);
    transition:opacity .26s ease, transform .32s cubic-bezier(.2,.85,.3,1);
  }
  #overlay.show .modal{opacity:1; transform:none}
  .modal h3{margin:0 0 4px; font-size:19px}
  .modal p.sub{margin:0 0 18px; font-size:12px; color:var(--dim)}
  kbd{
    font:inherit; font-size:10px; font-weight:700; color:var(--fg);
    background:#2b3450; border:1px solid #4b5876; border-bottom-width:2px;
    border-radius:4px; padding:1px 5px; margin:0 1px;
  }
  .picks{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .pickcard{
    width:172px; background:var(--panel2); border:2px solid var(--line); border-radius:12px;
    padding:16px 12px; cursor:pointer; text-align:center;
    opacity:0; animation:riseIn .44s cubic-bezier(.2,.85,.3,1) forwards;
  }
  /* riseIn이 끝나면 .ready가 붙어 애니메이션을 놓아준다. 그래야 hover가 transform을 쥘 수 있음 */
  .pickcard.ready{animation:none; opacity:1; transition:transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .16s, background .16s}
  .pickcard.ready:hover{
    transform:translateY(-10px) scale(1.04) rotate(-1deg);
    background:#39435c; box-shadow:0 16px 34px rgba(0,0,0,.55);
  }
  .pickcard.ready:active{transform:translateY(-4px) scale(1.01)}
  /* 키보드로 고르는 중인 칸 */
  .pickcard.kb{
    transform:translateY(-10px) scale(1.04);
    background:#39435c; box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 0 3px var(--o2);
  }
  .chip.pick.kb{border-color:var(--o2); background:#243a4a; box-shadow:0 0 0 2px rgba(111,220,255,.5)}
  .foot button.kb{box-shadow:0 0 0 3px var(--o2); border-color:var(--o2)}
  @keyframes riseIn{ from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none} }
  .pickcard .emo{font-size:40px; line-height:1.2}
  .pickcard .nm{font-weight:700; margin-top:4px}
  .pickcard .rar{font-size:10px; margin:3px 0 7px}
  .pickcard .ds{font-size:11px; color:var(--dim); line-height:1.5; min-height:52px}
  .pickcard .bs{font-size:11px; color:var(--o2); margin-top:6px; font-weight:600}
  /* 엮이는 심볼 줄 */
  .rel{
    display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-items:center;
    margin-top:8px; padding-top:8px; border-top:1px solid var(--line); min-height:30px;
  }
  .rel i{font-style:normal; font-size:17px; line-height:1}
  .rel b{font-size:10px; font-weight:700; color:var(--legend); background:rgba(255,190,61,.14);
         border-radius:5px; padding:2px 5px}
  /* 자기 자신을 가리키는 칸은 금테로 구분 */
  .rel i.self{
    border-radius:6px; padding:1px 3px;
    background:rgba(255,190,61,.16); box-shadow:0 0 0 1px rgba(255,190,61,.45) inset;
  }
  .rel.none{color:var(--dim); font-size:10px; min-height:0}
  #tip .rel{margin-top:6px; padding-top:6px; justify-content:flex-start; min-height:0}
  /* 정족수 진행도 */
  .quo{
    display:flex; align-items:center; gap:6px; margin-top:7px;
    font-size:10px; color:#ffbe3d; font-variant-numeric:tabular-nums;
  }

  .quo em i{display:block; height:100%; background:linear-gradient(90deg,#ff9d3d,#ffbe3d)}
  .quo b{font-weight:800}
  .quo.done{color:var(--good)}
  .quo.done em i{background:linear-gradient(90deg,#3ad77f,#6ee79a)}
  .quo.full{color:#ff8ae0}
  .quo.full em i{background:linear-gradient(90deg,#b06cff,#ff5fd2)}
  .modal .foot{margin-top:16px; display:flex; gap:10px; justify-content:center}

  /* 정산 화면 — 계산식 말고 라이프가 깎이는 그림 하나만 */
  .life{margin:2px 0 6px; line-height:1}
  .life b{
    display:block; font-size:64px; letter-spacing:-2px; color:var(--o2);
    font-variant-numeric:tabular-nums; text-shadow:0 0 24px rgba(111,220,255,.35);
  }
  .life .loss{
    margin-top:8px; font-size:22px; font-weight:700; color:var(--bad);
    font-variant-numeric:tabular-nums; animation:lossIn .5s .55s ease both;
  }
  @keyframes lossIn{ from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none} }

  /* ── 홈 화면 */
  .home{
    position:fixed; inset:0; z-index:70; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(ellipse 70% 60% at 50% 45%, rgba(20,14,48,.72), rgba(4,6,16,.93));
    backdrop-filter:blur(3px);

  }

  .hbox{text-align:center; max-width:560px; animation:riseIn .5s cubic-bezier(.2,.85,.3,1) both}
  .hsign{display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:14px}
  .hsign .deco{font-size:36px; filter:drop-shadow(0 0 14px rgba(120,200,255,.8))}
  .hbox h1{

    text-shadow:0 0 8px #fff, 0 0 22px #6fdcff, 0 0 48px #3ad7ff, 0 0 80px rgba(176,108,255,.9);
  }
  .hbox h1 b{

    text-shadow:0 0 8px #fff, 0 0 24px #ff5fd2, 0 0 54px #b06cff;
  }
  .htag{margin:18px 0 0; font-size:13px; line-height:1.9; color:#bcc6dc}
  .hbest{margin:20px 0 0; font-size:12px; color:var(--dim); letter-spacing:1px; font-variant-numeric:tabular-nums}
  .hbest b{font-size:22px; color:var(--good); margin-left:6px; text-shadow:0 0 14px rgba(110,231,154,.6)}
  .hbtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px}
  .hbtn{padding:13px 26px; border-radius:999px; font-size:14px; font-weight:800; letter-spacing:.5px}
  .hbtn.go{
    background:linear-gradient(180deg,#2fd0ea,#1183ad); border-color:#2fd0ea; color:#03222e;
    box-shadow:0 0 20px rgba(58,215,255,.5), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .hbtn.go:hover{filter:brightness(1.12)}
  .hbtn.sub{background:rgba(36,26,82,.85); border-color:rgba(186,124,255,.55)}
  .hbtn.sub:hover{border-color:var(--o2)}
  .hhint{margin:20px 0 0; font-size:11px; color:var(--dim)}
  .hhint b{color:var(--o2)}
  #homeBtn{padding:6px 10px; font-size:14px; line-height:1}
  #skinBtn{padding:6px 12px; font-size:12px; font-weight:800}

  /* ── 처음 보는 사람용 안내 */
  .guide{
    position:fixed; inset:0; z-index:80; display:none;

    opacity:0; transition:opacity .2s;
  }
  .guide.on{display:flex}
  .guide.show{opacity:1}
  .gbox{
    position:relative; display:flex; width:100%; max-width:980px; height:min(720px, 90vh);
    background:linear-gradient(180deg,rgba(30,22,66,.98),rgba(15,11,34,.99));
    border:1px solid rgba(186,124,255,.5); border-radius:18px; overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.7), 0 0 40px rgba(140,90,240,.25);
  }
  .gtabs{
    width:186px; flex:none; padding:16px 10px; display:flex; flex-direction:column; gap:4px;
    background:rgba(10,7,26,.6); border-right:1px solid rgba(186,124,255,.28);
  }
  .gtabs button{
    text-align:left; border:0; background:transparent; border-radius:9px;
    padding:9px 12px; font-size:13px; font-weight:700; color:var(--dim);
  }
  .gtabs button:hover{background:rgba(186,124,255,.12); color:var(--fg)}
  .gtabs button.on{background:rgba(186,124,255,.22); color:#fff; box-shadow:inset 2px 0 0 var(--o2)}
  .gbody{flex:1; min-width:0; padding:22px 26px 76px; overflow-y:auto; overflow-x:hidden; font-size:13px; line-height:1.75}
  .gbody h3{margin:0 0 4px; font-size:19px}
  .gbody h4{margin:20px 0 6px; font-size:14px; color:var(--o2)}
  .gbody p{margin:0 0 10px; color:#cfd7e8}
  .gbody .lead{color:var(--dim); margin-bottom:16px}
  .gbody b{color:#fff}
  .gbody table{border-collapse:collapse; width:100%; margin:8px 0 14px; font-size:12px}
  .gbody th,.gbody td{padding:6px 9px; border-bottom:1px solid rgba(186,124,255,.18); text-align:left}
  .gbody th{color:var(--dim); font-weight:600; font-size:11px}
  .gbody td.num{text-align:right; font-variant-numeric:tabular-nums}
  .gbody .calc{
    background:rgba(10,7,26,.7); border:1px solid rgba(186,124,255,.28); border-radius:10px;
    padding:12px 14px; margin:10px 0 14px; font-variant-numeric:tabular-nums;
  }
  .gbody .calc .row{display:flex; justify-content:space-between; gap:12px}
  .gbody .calc .row.sum{border-top:1px solid rgba(186,124,255,.28); margin-top:6px; padding-top:6px; font-weight:800; color:#fff}
  .gbody .sym{
    display:inline-flex; align-items:center; gap:4px; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:3px 7px; margin:2px 3px 2px 0;
    font-size:15px; white-space:nowrap;
  }
  .gbody .sym u{text-decoration:none; font-size:11px; color:#cfd7e8}
  .gbody .deckcard{
    border:1px solid rgba(186,124,255,.3); border-radius:12px; padding:13px 15px; margin:0 0 12px;
    background:rgba(10,7,26,.45);
  }
  .gbody .deckcard .ttl{font-size:15px; font-weight:800; color:#fff; margin-bottom:2px}
  .gbody .deckcard .meta{font-size:11px; color:var(--legend); margin-bottom:7px}
  .gfoot{
    position:absolute; right:18px; bottom:16px; display:flex; align-items:center; gap:12px;
    font-size:11px; color:var(--dim);
  }
  .gfoot b{color:var(--fg)}
  .gbody{padding-bottom:76px}
  @media (max-width:760px){ .gfoot{position:static; padding:12px 16px; justify-content:center; flex-wrap:wrap} }

  /* ── 심볼 고르기 */
  .mpick{margin:0 0 16px}
  .mgrp{display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-bottom:6px}
  .mgrp > span{font-size:10px; font-weight:700; width:34px; flex:none}
  .mpick button{
    padding:5px 7px; border-radius:8px; font-size:17px; line-height:1;
    background:var(--panel2); border:1px solid var(--line);
  }
  .mpick button.wide{font-size:12px; font-weight:700; padding:7px 12px}
  .mpick button:hover{border-color:var(--o2)}
  .mpick button.on{border-color:var(--o2); box-shadow:0 0 0 2px rgba(111,220,255,.5); background:#243a4a}

  /* ── 3×3 미니 예시 */
  .mwrap{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap}
  .mgrid{
    display:grid; grid-template-columns:repeat(3, 62px); gap:6px; flex:none;

  /* ── 20칸 덱 판 */
  .dgrid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; margin:12px 0 14px;
    background:linear-gradient(180deg,#241a52,#150f36);

  }
  .dcell{
    position:relative; aspect-ratio:1; border-radius:8px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:rgba(38,46,66,.85); border:1px solid var(--line); font-style:normal;
  }
  .dcell.empty{background:rgba(22,28,45,.5)}
  .dcell b{font-size:19px; line-height:1}
  .dcell u{text-decoration:none; font-size:10px; font-weight:800; color:var(--dim); font-variant-numeric:tabular-nums}
  .dcell.on{
    background:rgba(111,220,255,.2); border-color:var(--o2);
    box-shadow:0 0 0 2px var(--o2), 0 0 16px rgba(111,220,255,.55);
  }
  .dcell.on u{color:var(--o2)}
  .dcell.rel{background:rgba(111,220,255,.1); border-color:rgba(111,220,255,.55)}
  .mgrid .dcell b{font-size:26px}

  /* 툴팁 */
  #tip{
    position:fixed; z-index:60; pointer-events:none; display:none;
    background:rgba(10,14,26,.97); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; font-size:12px; max-width:230px; line-height:1.5;
    box-shadow:0 6px 20px rgba(0,0,0,.55);
  }
  #tip b{display:block; margin-bottom:2px}
  #tip .ds{color:var(--dim); font-size:11px}

  /* ══════════════════════════════════════════════════════
     심플 모드 — 네온·발광·움직임을 걷어낸 평면 버전.
     구조와 크기는 그대로 두고 "칠"만 바꾼다. 그래야 두 모드를
     오가도 레이아웃이 안 흔들리고, 익힌 위치 감각이 유지됨
     ══════════════════════════════════════════════════════ */
  body.simple{ --panel:#1b212c; --panel2:#2b3340; --line:#39414f;
               --o2:#8fd3e4; --bad:#e39191; --good:#8fd0a4; --legend:#dcb96a;
               --rare:#b9a3d8; --uncommon:#8fb2d8; --dim:#98a2b3; }

  /* 배경 — 움직이는 것 전부 정지, 성운도 걷어냄 */
  body.simple #space{ background:#141821 }
  body.simple .slayer,
  body.simple .drift,
  body.simple #space .planet,
  body.simple #space::after{ display:none }

  /* 캐비닛 — 아치와 네온 튜브를 없애고 평범한 패널로 */
  body.simple .cabinet{
    border-radius:14px; margin-right:118px;
    background:#1b212c; border:1px solid #39414f; box-shadow:none; backdrop-filter:none;
  }
  body.simple .cabinet::before{ display:none }
  body.simple .topper{ padding:12px 16px 10px; border-bottom:1px solid #2b323f }
  body.simple .topper .bulbrow,
  body.simple .topper .deco{ display:none }
  body.simple .topper .sign{ gap:8px; margin-top:0 }
  body.simple .topper h2{ font-size:13px; letter-spacing:3px; color:#c3ccdb; text-shadow:none; font-weight:700 }
  body.simple .topper h2 b{ display:inline; font-size:13px; letter-spacing:3px; margin-left:7px;
                            color:#c3ccdb; text-shadow:none }

  /* 릴 창 — 유리 반사와 발광 제거 */
  body.simple .window{
    background:#232a35; border:1px solid #39414f; box-shadow:none; border-radius:10px;
  }
  body.simple .window .glass{ display:none }

  /* 콘솔 · 계기 */
  body.simple .console{
    background:#232a35; border-color:#39414f; box-shadow:none; border-radius:10px;
  }
  body.simple .g{
    background:#1b212c; border-color:#39414f; box-shadow:none; backdrop-filter:none; border-radius:10px;
  }
  body.simple .g.big b{ text-shadow:none; color:#e8edf5 }
  body.simple .g.o2 b,
  body.simple .g.cost b{ text-shadow:none }
  body.simple .g .dots i{ background:#39414f }
  body.simple .g .dots i.on{ background:var(--o2); box-shadow:none }
  body.simple .seg{
    background:#12161e; border-color:#39414f; box-shadow:inset 0 2px 5px rgba(0,0,0,.5);
  }
  body.simple .seg i{ color:rgba(255,255,255,.06) }
  body.simple .seg b{ color:#d9e2ee; text-shadow:none }
  body.simple .seg u,
  body.simple .seg.score span{ color:var(--dim) }
  body.simple .pill.cyan{ background:#38566b; border-color:#4b6e86; color:#e8f3f8; box-shadow:none }
  body.simple .pill.pink{ background:#5a3f52; border-color:#7a5771; color:#f6e9f1; box-shadow:none }
  body.simple .payout{ background:#12161e; border-color:#2b323f }
  body.simple .payout .coinin{ border-color:#39414f; color:var(--dim) }
  body.simple .payout .purbar{ background:#12161e; box-shadow:inset 0 2px 5px rgba(0,0,0,.6) }
  body.simple .payout .purbar i{ background:#7f93b5; box-shadow:none }
  body.simple .payout .paylabel{ color:#c3ccdb; text-shadow:none }
  body.simple .payout .paylabel b{ color:var(--legend); text-shadow:none }
  body.simple .payout.drop .coinin{ box-shadow:none }
  body.simple .payout .coin{ box-shadow:none; background:#d8b45c }

<script>
"use strict";
/* engine.js가 안 실려 오면 아래 코드가 전부 ReferenceError로 죽고
   화면만 남아 "그림뿐인 페이지"가 된다. 왜 그런지는 알려줘야 함 */
if (typeof SYMBOLS === 'undefined'){
  document.body.innerHTML =
    '<div style="max-width:620px;margin:14vh auto;padding:28px;font:14px/1.9 system-ui;' +
    'color:#e8ecf4;background:#1b212c;border:1px solid #39414f;border-radius:14px">' +
    '<h2 style="margin:0 0 10px">engine.js를 불러오지 못했습니다</h2>' +
    '<p style="color:#98a2b3;margin:0 0 14px">규칙 엔진이 없으면 게임이 돌지 않습니다. ' +
    'index.html 과 engine.js 가 같은 폴더에 있어야 합니다.</p>' +
    '<p style="color:#98a2b3;margin:0">브라우저가 file:// 에서 옆 파일 읽기를 막는 경우라면, ' +
    '폴더에서 아래를 실행하고 <b style="color:#8fd3e4">http://localhost:8000</b> 으로 여세요.</p>' +
    '<pre style="background:#12161e;padding:12px 14px;border-radius:9px;margin:12px 0 0;' +
    'color:#8fd3e4">python3 -m http.server 8000</pre></div>';
  throw new Error('engine.js not loaded');
}
/* ══════════════════════════════════════════════════════════════════
   우주탐험 — 화면과 진행
   ─ 규칙(심볼 테이블, 점수 판정, 소모량 곡선)은 전부 engine.js에 있음.
     밸런스 시뮬레이터(sim/balance.js)가 같은 파일을 쓰기 때문에,
     "돌려본 수치"와 "실제로 도는 게임"이 어긋날 수 없음
   변경내역
     v0.3  engine.js 분리, 시뮬레이션 기반 수치 반영, 배경 밝기 상향
     v0.4  스핀 5회 고정, 수경재배 3단계(🌱→🌷→🌸), 원형별 통과율 기준 재조정
     v0.5  순도 규칙 도입, 심볼 43종, 레버·카드 호버·배속(1~3×) 추가
   이슈 사항 (일부러 안 넣은 것)
     ─ 아이템/유물: 심볼만으로 밸런스가 잡히는지 먼저 보고 나중에
     ─ 서버 랭킹: 기록은 localStorage에만
   ══════════════════════════════════════════════════════════════════ */

// ══════════════════════════════════ 그리기 상수
const CELL = 96, GAP = 8, PAD = 8;
// 심볼이 59종이라 3장으로는 자기 축이 좀처럼 안 뜸 — 4장으로 늘려 조립 속도를 맞춤
const PICK_COUNT = 4;

const $ = s => document.querySelector(s);

/* localStorage는 file:// 이나 사생활 보호 모드에서 접근만으로 예외를 던진다.
   최상단에서 터지면 스크립트가 통째로 죽어 "그림만 있는 페이지"가 되므로 감싼다 */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
};
/* 연출 배속. 대기시간을 전부 여기로 통과시켜서 버튼 하나로 조절됨 */
let speed = Math.min(Number(store.get('oxy.speed') || 1), 2);
const sleep = ms => new Promise(r => setTimeout(r, ms / speed));

// ══════════════════════════════════ 상태
let game = null;
let busy = false;
const reel = { active:false, cols:[] };      // 릴이 도는 동안 draw()가 열 단위로 그림
const disp = { coins:0, lock:false };        // 화면에 보여줄 O₂ (실제 값을 스르륵 따라감)

// ══════════════════════════════════ 소리
/* 오실레이터 하나로 끝내는 최소 구현. 슬롯은 소리가 절반이라 안 넣을 수가 없음.
   AudioContext는 첫 클릭(스핀 버튼) 안에서 만들어져서 자동재생 정책에 안 걸림 */
let actx = null, muted = store.get('oxy.muted') !== '0';   // 기본은 음소거
function beep(freq, dur, type, gain){
  if (muted) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain || .04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(err){ muted = true; }   // 오디오 못 쓰는 환경이면 조용히 포기
}

// ══════════════════════════════════ O₂ 숫자 굴리기
/* 벌 때는 감속하며 따라붙고(티커), 깎일 때는 전광판처럼 선형으로 떨어짐 */
let ticker = 0;
function startTicker(){
  if (ticker) return;
  ticker = requestAnimationFrame(function step(){
    let alive = false;
    if (!disp.lock){
      const gap = game.coins - disp.coins;
      if (Math.abs(gap) > 0.5){ disp.coins += gap * 0.18; alive = true; }
      else disp.coins = game.coins;
    }
    draw(); renderStats();
    ticker = alive ? requestAnimationFrame(step) : 0;
  });
}

/* 감속을 주면 "정산했다"가 아니라 "슬슬 줄어든다"로 보여서 일부러 선형으로 감 */
function drainNumber(from, to, ms){
  return new Promise(res => {
    disp.lock = true;
    const t0 = performance.now();
    let lastTick = 0;
    (function step(now){
      const p = Math.min((now - t0) / ms, 1);
      disp.coins = from + (to - from) * p;
      renderStats();
      if (now - lastTick > 40){ lastTick = now; beep(1150, .014, 'square', .022); }
      if (p < 1) requestAnimationFrame(step);
      else { disp.coins = to; disp.lock = false; renderStats(); res(); }
    })(t0);
  });
}

// ══════════════════════════════════ 새 항해
function newGame(){
  game = {
    round: 1,
    coins: 0,
    spinsLeft: spinsFor(1),
    cost: costFor(1),
    paidTotal: 0,
    deck: START_DECK.map(mkEntry),
    cells: makeCells(),
    debt: { mul:1, add:0 },      // 다음 구역 소모량에 남은 빚
    purity: null,                // 직전 스핀의 순도 (화면 표시용)
    over: false,
    log: [],
  };
  disp.coins = 0;
  pushLog('<span class="hl">1구역 진입.</span> 생명유지 소모 ' + game.cost + ' O₂');
  render();
}

function score(){ return game.paidTotal + game.coins; }
function best(){ return Number(store.get('oxy.best') || 0); }

/* 스핀 한 번에 동전 하나. 애니메이션을 다시 트리거하려면 클래스를 뗐다가
   레이아웃을 한 번 읽어서 강제로 리플로우시켜야 함 */
function dropCoin(){
  const pay = $('#payout');
  pay.classList.remove('drop');
  void pay.offsetWidth;
  pay.classList.add('drop');
  beep(1400, .03, 'square', .035);
  setTimeout(() => beep(950, .05, 'triangle', .045), 200 / speed);
}

// ══════════════════════════════════ 한 스핀
async function spin(){
  if (busy || game.over || game.spinsLeft <= 0) return;
  busy = true; render();
  dropCoin();

  // 결과를 먼저 확정해두고 릴을 돌림. 열이 멈추는 순간 진짜 결과가 드러남
  fillCells(game.cells, game.deck, Math.random);
  await rollReels();
  await sleep(140);

  const coinsBefore = game.coins;
  const res = resolve(game, Math.random);
  const { total, notes } = res;
  game.purity = res;
  renderPurity();

  const lightsOff = () => { for (const c of game.cells) c.flash = 0; };
  /* 지금 계산 중인 칸만 세게, 그 칸이 실제로 값에 관여시킨 심볼들은 은은하게.
     다음 칸으로 넘어갈 땐 전부 껐다가 다시 켜서 한 번에 하나만 보이게 함 */
  const spotlight = cell => {
    lightsOff();
    cell.flash = 1;
    for (const l of cell.links) if (l.entry) l.flash = 0.55;
  };

  let acc = 0, idx = 0;
  for (const cell of game.cells){
    if (!cell.entry) continue;
    cell.show = true;

    if (cell.dead){
      spotlight(cell); draw();
      beep(140, .16, 'triangle', .06);
      await sleep(120);
      continue;
    }
    if (cell.val === 0){ lightsOff(); draw(); await sleep(14); continue; }

    spotlight(cell); draw();
    acc += cell.val;
    game.coins = Math.max(0, coinsBefore + acc);
    startTicker();
    // 칸을 하나씩 먹을수록 음이 올라감 — 연달아 터질 때 쾌감이 붙음
    beep(430 * Math.pow(1.05, Math.min(idx, 26)), .07, 'sine', .045);
    idx++;
    await sleep(105);
  }

  lightsOff();
  game.cells.forEach(c => c.show = true);
  game.coins = Math.max(0, coinsBefore + total);
  startTicker();
  game.spinsLeft--;

  const sign = total >= 0 ? 'plus' : 'minus';
  const purTxt = res.purity > 1 ? ` <span class="hl">순도 ×${res.purity}</span>` : '';
  pushLog(`${game.round}구역 · <span class="${sign}">${total>=0?'+':''}${total} O₂</span>${purTxt}`);
  notes.forEach(pushLog);
  render();
  await sleep(260);

  if (game.spinsLeft > 0) await offerSymbols();
  else                    await settleLifeSupport();

  busy = false; render();
}

/* 이 심볼이 어떤 심볼과 엮이는지 한 줄로. 초보자가 덱 방향을 감으로 잡는 데 이게 제일 큼 —
   설명을 끝까지 안 읽어도 "얘랑 얘를 같이 모으면 되는구나"가 그림으로 들어옴 */
/* 짝이 없는 심볼은 대개 "판 전체를 보는" 쪽이라, 단독이라고 쓰면 오해다.
   설명에서 사거리 낱말을 주워 범위로 보여줌 */
function scopeOf(d){
  if (d.includes('판에') || d.includes('판의') || d.includes('판 위'))       return '🗺️ 판 전체';
  if (d.includes('화물칸'))                                                return '📦 화물칸';
  if (d.includes('같은 행') || d.includes('같은 열') || d.includes('행·열')) return '➕ 같은 행·열';
  if (d.includes('인접'))                                                  return '⬚ 인접 8칸';
  if (d.includes('등장할 때마다') || d.includes('등장하면'))                 return '⏳ 등장할수록';
  return null;
}

/* 정족수가 걸린 심볼은 지금 몇 장 모았는지 보여줘야 판단이 됨.
   "서너 장만 얹어두면 손해"라는 규칙은 진행도가 안 보이면 그냥 함정임 */
function quorumRow(id){
  const need = SYMBOLS[id].quorum, full = SYMBOLS[id].done;
  if (!need) return '';
  const have = game.deck.filter(x => x.id === id).length;
  const goal = (full && have >= need) ? full : need;
  const cls  = full && have >= full ? ' full' : have >= need ? ' done' : '';
  const lab  = full && have >= need ? '완성까지' : '정족수';
  return `<div class="quo${cls}">
      <span>${cls === ' full' ? '완성' : lab}</span>
      <em><i style="width:${Math.min(100, have/goal*100)}%"></i></em>
      <b>${have}/${goal}</b></div>`;
}

function relRow(id){
  const r = relatedOf(id);
  if (!r.ids.length && !r.selfRef){
    const sc = scopeOf(SYMBOLS[id].d);
    return sc ? `<div class="rel"><b>${sc}</b></div>`
              : '<div class="rel none">단독으로 쓰는 심볼</div>';
  }
  // 자기끼리 뭉치는 심볼은 자기 이모지를 그대로 세워둠 (글자보다 이게 바로 읽힘)
  const self = r.selfRef
    ? `<i class="self" title="${SYMBOLS[id].n} — 같은 심볼끼리 뭉칠수록 강해진다">${SYMBOLS[id].e}</i>`
    : '';
  const list = r.ids.map(x => `<i title="${SYMBOLS[x].n}">${SYMBOLS[x].e}</i>`).join('');
  return `<div class="rel">${self}${list}</div>`;
}

// ══════════════════════════════════ 심볼 획득 (매 스핀 후)
function offerSymbols(){
  const picks = rollChoices(PICK_COUNT, Math.random, game.round, game.deck);
  return modal({
    title: '무엇을 실을까',
    sub: '고른 심볼이 화물칸에 들어간다 &nbsp;·&nbsp; <kbd>←→</kbd> 이동 <kbd>Space</kbd> 선택 (건너뛰기도 골라서 <kbd>Space</kbd>)',
    body: `<div class="picks">${picks.map((id,i)=>{
      const s = SYMBOLS[id], rar = RARITY[s.r];
      return `<div class="pickcard" data-i="${i}" style="border-color:${rar.color};animation-delay:${Math.round((70+i*70)/speed)}ms;animation-duration:${Math.round(440/speed)}ms">
        <div class="emo">${s.e}</div>
        <div class="nm">${s.n}</div>
        <div class="rar" style="color:${rar.color}">${rar.label}</div>
        <div class="ds">${s.d}</div>
        ${relRow(id)}${quorumRow(id)}
        <div class="bs">기본 O₂: ${s.base}</div>
      </div>`;
    }).join('')}</div>`,
    buttons: [{ label:'건너뛰기', value:-1 }],
    onPick: el => el.closest('.pickcard') ? +el.closest('.pickcard').dataset.i : null,
  }).then(v => {
    if (v >= 0){
      game.deck.push(mkEntry(picks[v]));
      pushLog(`${SYMBOLS[picks[v]].e} ${SYMBOLS[picks[v]].n} 적재`);
    }
    render();
  });
}

// ══════════════════════════════════ 생명유지 정산
async function settleLifeSupport(){
  const cut = costCutOf(game.deck, game.cost);
  const due = Math.max(0, game.cost - cut);
  if (cut) pushLog(`🎫 보급 쿠폰으로 ${cut} O₂ 절감`);

  const ok = game.coins >= due;
  await drainModal(due, ok);

  if (!ok){
    game.over = true;
    pushLog(`<span class="minus">${due} O₂를 대지 못했다. 표류.</span>`);
    render();
    await gameOver();
    return;
  }

  game.paidTotal += due;
  pushLog(`<span class="hl">${game.round}구역 통과 · ${due} O₂ 소모</span> (잔량 ${game.coins})`);
  render();

  await maintenance();

  game.round++;
  game.cost = Math.round(costFor(game.round) * game.debt.mul) + game.debt.add;
  if (game.debt.mul !== 1 || game.debt.add !== 0)
    pushLog(`<span class="minus">저당 잡힌 만큼 소모량이 불어났다</span>`);
  game.debt = { mul:1, add:0 };
  game.spinsLeft = spinsFor(game.round);
  pushLog(`<span class="hl">${game.round}구역 진입.</span> 소모 ${game.cost} O₂ / 스핀 ${game.spinsLeft}회`);
  render();
}

/* 산소가 빠져나가는 장면. 그냥 숫자만 줄이면 언제 깎였는지 아무도 모름 —
   모달로 세우고, 현재 산소량을 충분히 보여준 뒤, HUD를 흔들며 깎아내림 */
function drainModal(due, ok){
  const before = game.coins;
  return modal({
    title: ok ? '생명유지 정산' : '산소 고갈',
    sub: ok
      ? `${game.round}구역을 지나며 생명유지장치가 산소를 가져간다`
      : `${due} O₂가 필요한데 ${before}밖에 없다`,
    body: `<div class="life">
        <b id="${ok ? 'dTo' : 'dNo'}">${before}</b>
        <div class="loss">−${due} O₂</div>
      </div>`,
    buttons: [{ label: ok ? '계속' : '항해 종료', value:1 }],
    onPick: () => null,
    onOpen: () => {
      if (!ok){ beep(180,.5,'sawtooth',.06); setTimeout(()=>beep(120,.7,'sawtooth',.06), 220); return; }
      // 깎기 전에 지금 산소량을 충분히 보여줌 — 바로 깎으면 얼마였는지가 안 읽힘
      setTimeout(() => {
        document.body.classList.add('draining');
        game.coins = before - due;
        const ms = Math.min(1600, 550 + due * 3.5) / speed;   // 많이 깎일수록 조금 더 오래
        drainNumber(before, game.coins, ms).then(() => {
          document.body.classList.remove('draining');
          beep(300, .18, 'triangle', .06);
          render();
        });
      }, 1100 / speed);
    },
  });
}

/* 정비 — 화물칸에서 한 장 버리기. 눌어붙는 심볼(임시 배관)은 확률로 안 떨어짐 */
function maintenance(){
  const counts = deckCounts();
  return modal({
    title: '정비',
    sub: '화물칸에서 심볼 하나를 버릴 수 있다 (한 장만) &nbsp;·&nbsp; <kbd>←→↑↓</kbd> 이동 <kbd>Space</kbd> 선택',
    body: `<div class="deck" style="justify-content:center;max-height:none">${
      counts.map(c => `<div class="chip pick" data-id="${c.id}" data-uid="${c.uid}">${SYMBOLS[c.id].e}${c.bg ? `<u>${c.bg}</u>` : ''}<i>${c.k}</i></div>`).join('')
    }</div>`,
    buttons: [{ label:'그냥 두기', value:null }],
    onPick: el => el.closest('.chip') ? +el.closest('.chip').dataset.uid : null,
  }).then(uid => {
    if (uid){
      const i = game.deck.findIndex(x => x.uid === uid);
      if (i >= 0){
        const def = SYMBOLS[game.deck[i].id];
        if (Math.random() < (def.sticky || 0)){
          pushLog(`${def.e} ${def.n} — 안 떨어진다`);
          beep(160, .2, 'sawtooth', .05);
        } else {
          game.deck.splice(i,1);
          pushLog(`${def.e} ${def.n} 투기`);
        }
      }
    }
    render();
  });
}

async function gameOver(){
  const s = score(), b = best();
  const isNew = s > b;
  if (isNew) store.set('oxy.best', String(s));
  await modal({
    title: isNew ? '🎉 신기록!' : '표류',
    sub: `${game.round}구역까지 항해 · 점수 ${s}점` + (isNew ? '' : ` · 최고기록 ${b}점`),
    body: `<div style="font-size:13px;color:var(--dim);line-height:1.8">
      누적 소모 ${game.paidTotal} O₂<br>남은 O₂ ${game.coins}<br>화물칸 ${game.deck.length}장</div>`,
    buttons: [{ label:'다시 출항', value:1 }, { label:'홈으로', value:2 }],
    onPick: () => null,
  }).then(v => {
    newGame();
    if (v === 2) showHome(true);
  });
}

// ══════════════════════════════════ 모달
function modal({ title, sub, body, buttons, onPick, onOpen }){
  return new Promise(resolve => {
    const ov = $('#overlay');
    // 직전 모달이 예약해둔 뒷정리 타이머 취소.
    // 안 끄면 정산 → 정비처럼 연달아 열 때 새로 그린 내용까지 같이 지워버림
    if (ov._clean){ clearTimeout(ov._clean); ov._clean = 0; }
    ov.innerHTML = `<div class="modal">
      <h3>${title}</h3><p class="sub">${sub}</p>${body}
      <div class="foot">${buttons.map((b,i)=>`<button data-b="${i}">${b.label}</button>`).join('')}</div>
    </div>`;
    ov.classList.add('on');
    void ov.offsetWidth;               // 한 프레임 기다리는 대신 리플로우를 강제 —
    ov.classList.add('show');          // 배경 탭에서는 rAF가 아예 안 돌아 유령 상태가 됨
    if (onOpen) onOpen();
    // 떠오르는 연출이 끝나면 애니메이션을 놓아줘서 hover가 살아나게
    ov.querySelectorAll('.pickcard').forEach(el =>
      el.addEventListener('animationend', () => el.classList.add('ready'), { once:true }));

    /* ── 키보드 조작. 마우스 없이도 한 판이 굴러가야 함
       ← → ↑ ↓ 이동 · Space 선택.
       건너뛰기 버튼도 이동 대상에 넣어서, 고르는 것도 넘기는 것도 전부 Space 하나로 */
    const items = [...ov.querySelectorAll('.pickcard, .chip.pick, .foot button')];
    let kb = items.length ? 0 : -1;
    const paint = () => items.forEach((el, i) => el.classList.toggle('kb', i === kb));
    paint();
    items.forEach((el, i) => el.addEventListener('mouseenter', () => { kb = i; paint(); }));

    /* 방향 이동은 좌표로 고름 — 카드는 한 줄이고 화물칸 칩은 여러 줄이라
       인덱스로만 굴리면 위아래가 엉뚱한 데로 감 */
    const move = dir => {
      if (kb < 0) return;
      const cur = items[kb].getBoundingClientRect();
      const cx = cur.left + cur.width/2, cy = cur.top + cur.height/2;
      let best = -1, bestD = Infinity;
      items.forEach((el, i) => {
        if (i === kb) return;
        const r = el.getBoundingClientRect();
        const dx = (r.left + r.width/2) - cx, dy = (r.top + r.height/2) - cy;
        const ok = dir === 'right' ? dx > 4 : dir === 'left' ? dx < -4
                 : dir === 'down'  ? dy > 4 : dy < -4;
        if (!ok) return;
        const along  = Math.abs(dir === 'left' || dir === 'right' ? dx : dy);
        const across = Math.abs(dir === 'left' || dir === 'right' ? dy : dx);
        const d = along + across * 3;                 // 축을 벗어날수록 크게 감점
        if (d < bestD){ bestD = d; best = i; }
      });
      if (best < 0 && (dir === 'left' || dir === 'right'))   // 좌우는 끝에서 감김
        best = dir === 'right' ? 0 : items.length - 1;
      if (best >= 0){ kb = best; paint(); beep(720, .02, 'square', .02); }
    };

    const onKey = ev => {
      if (ev.code === 'Space'){                       // 지금 짚고 있는 걸 고른다
        ev.preventDefault(); ev.stopPropagation();
        if (kb < 0){ done(buttons[buttons.length-1].value); return; }
        const el = items[kb];
        const btn = el.matches('button[data-b]') ? el : null;
        if (btn){ done(buttons[+btn.dataset.b].value); return; }
        const v = onPick(el);
        if (v !== null && v !== undefined){ done(v); return; }
        return;
      }
      const dir = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' }[ev.key];
      if (dir){ ev.preventDefault(); ev.stopPropagation(); move(dir); }
    };
    document.addEventListener('keydown', onKey, true);

    ov.onclick = ev => {
      const btn = ev.target.closest('button[data-b]');
      if (btn){ done(buttons[+btn.dataset.b].value); return; }
      const picked = onPick(ev.target);
      if (picked !== null && picked !== undefined) done(picked);
    };
    function done(v){
      document.removeEventListener('keydown', onKey, true);
      ov.classList.remove('show');
      ov.onclick = null;
      ov._clean = setTimeout(() => { ov.classList.remove('on'); ov.innerHTML = ''; ov._clean = 0; }, 200);
      resolve(v);
    }
  });
}

/* 캔버스 색은 CSS가 못 건드리니 스킨 객체로 따로 둔다.
   네온은 발광·반투명 위주, 심플은 불투명한 회청색 평면 */
const SKINS = {
  neon:   { board:'rgba(16,22,40,.6)',  cellOn:'rgba(38,46,66,.92)', cellOff:'rgba(22,28,45,.72)',
            line:'#3b455e', bar:'rgba(150,225,255,.45)', reel:'rgba(31,38,58,.95)', vig:'8,12,24',
            pos:'#6fdcff', neg:'#ff7b7b', posBg:'rgba(111,220,255,.18)', negBg:'rgba(255,123,123,.18)',
            hotPos:'111,220,255', hotNeg:'255,123,123', glow:1 },
  simple: { board:'#1b212c',            cellOn:'#2b3340',            cellOff:'#232a35',
            line:'#39414f', bar:'rgba(255,255,255,.09)', reel:'#262e3a', vig:'18,22,30',
            pos:'#8fd3e4', neg:'#e39191', posBg:'rgba(143,211,228,.14)', negBg:'rgba(227,145,145,.14)',
            hotPos:'143,211,228', hotNeg:'227,145,145', glow:0 },
};
let skin = SKINS.neon;

// ══════════════════════════════════ 그리기
const cv = $('#reel'), cx = cv.getContext('2d');
(function setupCanvas(){
  const w = COLS*CELL + (COLS+1)*GAP + PAD*2;
  const h = ROWS*CELL + (ROWS+1)*GAP + PAD*2;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.aspectRatio = `${w} / ${h}`;
  cx.scale(dpr, dpr);
  cv._w = w; cv._h = h;
})();

function cellRect(cell){
  return { x: PAD + GAP + cell.c*(CELL+GAP), y: PAD + GAP + cell.r*(CELL+GAP), w: CELL, h: CELL };
}

function roundRect(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r);
  cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath();
}

function draw(){
  if (!game) return;                 // 초기화 전에 불려도 죽지 않게
  cx.clearRect(0,0,cv._w,cv._h);
  cx.fillStyle = skin.board;
  roundRect(PAD/2, PAD/2, cv._w-PAD, cv._h-PAD, 12); cx.fill();

  /* 릴을 가르는 네온 기둥. CSS로 20%씩 나눠 그렸더니 캔버스 실제 칸 경계
     (21.3 / 40.4 / 59.6 / 78.7%)와 어긋나서, 여기서 같은 좌표계로 그림 */
  const barTop = PAD + GAP, barH = ROWS*CELL + (ROWS-1)*GAP;
  for (let c = 1; c < COLS; c++){
    const x = PAD + GAP + c*(CELL+GAP) - GAP/2;
    const g = cx.createLinearGradient(x-3, 0, x+3, 0);
    g.addColorStop(0,   'rgba(0,0,0,0)');
    g.addColorStop(.5,  skin.bar);
    g.addColorStop(1,   'rgba(0,0,0,0)');
    cx.fillStyle = g;
    cx.fillRect(x-3, barTop, 6, barH);
  }

  // 열 단위로 그림. 아직 도는 열은 스크롤 스트립, 멈춘 열은 실제 결과
  for (let c = 0; c < COLS; c++){
    const col = reel.active ? reel.cols[c] : null;
    if (col && !col.stopped){ drawReelCol(c, col); continue; }
    const yOff = col ? col.bounce : 0;
    for (let r = 0; r < ROWS; r++) drawCell(game.cells[r*COLS + c], yOff);
  }
}

function drawCell(cell, yOff){
  const R = cellRect(cell);
  R.y += yOff || 0;

  cx.fillStyle = cell.entry ? skin.cellOn : skin.cellOff;
  roundRect(R.x,R.y,R.w,R.h,10); cx.fill();
  cx.strokeStyle = skin.line; cx.lineWidth = 1;
  roundRect(R.x+.5,R.y+.5,R.w-1,R.h-1,10); cx.stroke();

  if (!cell.entry) return;
  const def = SYMBOLS[cell.entry.id];
  if (!def) return;

  // 점수 계산 중 이 칸이 관여하면 테두리가 달아오름
  const f = cell.flash || 0;
  if (f > 0){
    const hot = (cell.val < 0 || cell.dead) ? skin.hotNeg : skin.hotPos;
    cx.save();
    cx.fillStyle = `rgba(${hot},${.16*f})`;
    roundRect(R.x,R.y,R.w,R.h,10); cx.fill();
    cx.shadowColor = `rgba(${hot},${.9*f})`; cx.shadowBlur = 20*f*skin.glow;
    cx.strokeStyle = `rgba(${hot},${.95*f})`; cx.lineWidth = 2;
    roundRect(R.x+1,R.y+1,R.w-2,R.h-2,10); cx.stroke();
    cx.restore();
  }

  cx.globalAlpha = cell.dead ? .22 : 1;
  cx.font = (46 + 7*f).toFixed(1) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(def.e, R.x+R.w/2, R.y+R.h/2 - 4);
  cx.globalAlpha = 1;

  // 턴을 세거나(외계 알) 누적치가 있는(수경재배·화물) 심볼은 좌상단에 표시
  const bg = def.badge && def.badge(cell.entry);
  if (bg && !cell.dead){
    cx.font = '700 11px system-ui,sans-serif';
    cx.textAlign = 'left'; cx.textBaseline = 'top';
    const bw = cx.measureText(bg).width + 9;
    cx.fillStyle = 'rgba(255,190,61,.22)';
    roundRect(R.x+5, R.y+5, bw, 16, 5); cx.fill();
    cx.fillStyle = '#ffbe3d';
    cx.fillText(bg, R.x+9, R.y+8);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
  }

  if (cell.dead){
    cx.font = '30px sans-serif';
    cx.fillText('💥', R.x+R.w/2, R.y+R.h/2 - 4);
  } else if (cell.show && cell.val !== 0){
    const txt = (cell.val > 0 ? '+' : '') + cell.val;
    cx.font = '700 15px system-ui,sans-serif';
    const w = cx.measureText(txt).width + 12;
    cx.fillStyle = cell.val > 0 ? skin.posBg : skin.negBg;
    roundRect(R.x+R.w/2-w/2, R.y+R.h-27, w, 20, 6); cx.fill();
    cx.fillStyle = cell.val > 0 ? skin.pos : skin.neg;
    cx.fillText(txt, R.x+R.w/2, R.y+R.h-17);
  }
}

/* 도는 중인 열 하나. 칸 경계 없이 통짜 창으로 그려야 릴처럼 이어져 보임 */
function drawReelCol(c, col){
  const step = CELL + GAP;
  const x  = PAD + GAP + c*step;
  const y0 = PAD + GAP;
  const h  = ROWS*CELL + (ROWS-1)*GAP;

  cx.fillStyle = skin.reel;
  roundRect(x, y0, CELL, h, 10); cx.fill();

  cx.save();
  roundRect(x, y0, CELL, h, 10); cx.clip();
  cx.font = '46px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  // 같은 그림을 위아래로 살짝 어긋나게 겹쳐 찍어서 모션 블러 흉내
  const ghosts = [[0,.85],[-9,.3],[9,.3],[-18,.12],[18,.12]];
  for (const [dy, a] of ghosts){
    cx.globalAlpha = a;
    for (let k = -1; k <= ROWS; k++){
      const id = col.strip[k+1];
      if (!id) continue;
      cx.fillText(SYMBOLS[id].e, x + CELL/2, y0 + k*step + col.offset + CELL/2 - 4 + dy);
    }
  }
  cx.globalAlpha = 1;

  // 릴 창 위아래를 어둡게 — 실제 슬롯 릴통 안쪽 그림자
  const grd = cx.createLinearGradient(0, y0, 0, y0+h);
  grd.addColorStop(0,   `rgba(${skin.vig},.85)`);
  grd.addColorStop(.22, `rgba(${skin.vig},0)`);
  grd.addColorStop(.78, `rgba(${skin.vig},0)`);
  grd.addColorStop(1,   `rgba(${skin.vig},.85)`);
  cx.fillStyle = grd;
  cx.fillRect(x, y0, CELL, h);
  cx.restore();

  cx.strokeStyle = skin.line; cx.lineWidth = 1;
  roundRect(x+.5, y0+.5, CELL-1, h-1, 10); cx.stroke();
}

/* 릴 굴리기. 열마다 조금씩 늦게 멈추고, 멈출 때 한 번 툭 튄다 */
const SETTLE = 0.16;
function rollReels(){
  const step = CELL + GAP;
  const ids = Object.keys(SYMBOLS);
  const pick = () => ids[(Math.random()*ids.length)|0];

  reel.cols = [];
  for (let c = 0; c < COLS; c++){
    reel.cols.push({
      idx: c, offset: 0,
      speed: (2000 + Math.random()*300) * speed,
      stopAt: (400 + c*130) / speed,
      stopped: false, settle: 0, bounce: 0,
      strip: Array.from({length: ROWS+2}, pick),
    });
  }
  reel.active = true;

  return new Promise(res => {
    const t0 = performance.now();
    let last = t0, lastTick = 0;
    (function frame(now){
      const dt = Math.min((now - last)/1000, .05); last = now;
      const el = now - t0;
      let running = false;

      for (const col of reel.cols){
        if (!col.stopped){
          if (el >= col.stopAt){
            col.stopped = true;
            beep(190 + col.idx*30, .1, 'triangle', .07);   // 열이 물리는 소리
          } else {
            col.offset += col.speed*dt;
            while (col.offset >= step){        // 한 칸 넘어가면 스트립을 한 칸 밀어줌
              col.offset -= step;
              col.strip.pop();
              col.strip.unshift(pick());
              if (col.idx === 0 && now - lastTick > 55){ lastTick = now; beep(900, .02, 'square', .02); }
            }
          }
        }
        if (col.stopped && col.settle < SETTLE/speed){
          col.settle += dt;
          col.bounce = Math.sin(Math.min(col.settle/(SETTLE/speed), 1) * Math.PI) * 9;
          running = true;
        } else if (!col.stopped){
          running = true;
        } else {
          col.bounce = 0;
        }
      }

      draw();
      if (running) requestAnimationFrame(frame);
      else { reel.active = false; draw(); res(); }
    })(t0);
  });
}

// ══════════════════════════════════ DOM 갱신
/* 화물칸 목록. 같은 심볼이라도 자란 정도(수경재배)나 남은 턴(외계 알)이 다르면
   따로 세워줘야 뭘 버릴지 고를 수 있음 — 그래서 id가 아니라 id+뱃지로 묶음 */
function deckCounts(){
  const m = new Map();
  for (const en of game.deck){
    const def = SYMBOLS[en.id];
    const bg  = def && def.badge ? def.badge(en) : null;
    const key = en.id + '|' + (bg || '');
    const cur = m.get(key) || { id: en.id, bg, k: 0, uid: en.uid };
    cur.k++;
    m.set(key, cur);
  }
  return [...m.values()].sort((a, b) => b.k - a.k);
}

function pushLog(html){
  game.log.unshift(html);
  if (game.log.length > 40) game.log.pop();
}

/* 숫자만 갱신. 티커가 매 프레임 부르는 자리라 DOM 재생성은 여기 두면 안 됨 */
function renderStats(){
  $('#sCoins').textContent = Math.round(disp.coins);
  $('#sRound').textContent = game.round;
  $('#sCost').textContent  = game.cost;
  $('#sSpins').textContent = game.spinsLeft;
  $('#sScore').textContent = score();
  $('#sBest').textContent  = best();

  const total = spinsFor(game.round);
  $('#sDots').innerHTML = Array.from({length: total},
    (_, i) => `<i class="${i < game.spinsLeft ? 'on' : ''}"></i>`).join('');

  const d = game.debt;
  $('#sDebt').textContent = (d.mul !== 1 || d.add !== 0)
    ? `다음 구역 저당 ${d.mul !== 1 ? '×' + d.mul.toFixed(2) : ''}${d.add ? ' +' + d.add : ''}`
    : '';

  const dTo = document.getElementById('dTo');      // 정산 모달이 떠 있으면 같이 굴려줌
  if (dTo) dTo.textContent = Math.round(disp.coins);
}

/* 순도 — 판에서 가장 많이 깔린 한 종류의 비율. 스핀 총합에 배수로 붙는다.
   전역 규칙이라 화면에 안 보이면 아예 없는 규칙이나 마찬가지 */
function renderPurity(){
  const p = game.purity, fill = $('#purFill'), lab = $('#purLabel');
  if (!p || !p.filled){ fill.style.width = '0'; lab.textContent = '순도 —'; return; }
  const ratio = p.purityTop / p.filled;
  fill.style.width = Math.round(ratio * 100) + '%';
  lab.innerHTML = `순도 ${p.purityTop}/${p.filled} <b>×${p.purity}</b>`;
}

function render(){
  renderStats();
  renderPurity();
  $('#lever').classList.toggle('off', busy || game.over || game.spinsLeft <= 0);

  const counts = deckCounts();
  $('#deckCount').textContent = `(${game.deck.length}장)`;
  $('#deckCountBtn').textContent = game.deck.length;
  $('#deck').innerHTML = counts.map(c =>
    `<div class="chip" data-id="${c.id}">${SYMBOLS[c.id].e}${c.bg ? `<u>${c.bg}</u>` : ''}<i>${c.k}</i></div>`).join('');
  $('#log').innerHTML = game.log.map(l => `<div>${l}</div>`).join('');
  draw();
}

const tip = $('#tip');
function showTip(id, x, y){
  const s = SYMBOLS[id]; if(!s) return;
  const rar = RARITY[s.r];
  tip.innerHTML = `<b>${s.e} ${s.n} <span style="color:${rar.color};font-size:10px">${rar.label}</span></b>
    <div class="ds">${s.d}</div>
    ${relRow(id)}${quorumRow(id)}
    <div class="ds" style="color:var(--o2)">기본 O₂: ${s.base}</div>`;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x+14, innerWidth - r.width - 8) + 'px';
  tip.style.top  = Math.min(y+14, innerHeight - r.height - 8) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

cv.addEventListener('mousemove', ev => {
  const b = cv.getBoundingClientRect();
  const sx = cv._w / b.width, sy = cv._h / b.height;
  const px = (ev.clientX - b.left) * sx, py = (ev.clientY - b.top) * sy;
  const hit = game.cells.find(cell => {
    const R = cellRect(cell);
    return px >= R.x && px <= R.x+R.w && py >= R.y && py <= R.y+R.h;
  });
  if (hit && hit.entry) showTip(hit.entry.id, ev.clientX, ev.clientY);
  else hideTip();
});
cv.addEventListener('mouseleave', hideTip);
document.addEventListener('mouseover', ev => {
  const chip = ev.target.closest('.chip');
  if (chip) showTip(chip.dataset.id, ev.clientX, ev.clientY);
});
document.addEventListener('mouseout', ev => { if (ev.target.closest('.chip')) hideTip(); });

/* 층마다 크기·속도를 달리해 시차(parallax)를 냄.
   같은 별 배치를 2000px 간격으로 두 장 깔고 통째로 올려서 이음매 없이 반복 */
(function starfield(){
  const sky = $('#space');
  const H = 2000;
  const layers = [
    { n:190, size:1, color:'rgba(255,255,255,.95)', dur:'190s' },
    { n:80,  size:2, color:'rgba(200,228,255,.9)',  dur:'120s' },
    { n:26,  size:3, color:'rgba(255,242,214,.85)', dur:'80s'  },
  ];
  for (const L of layers){
    const shadow = Array.from({length:L.n}, () =>
      `${(Math.random()*2200)|0}px ${(Math.random()*H)|0}px ${L.color}`).join(',');
    const wrap = document.createElement('div');
    wrap.className = 'slayer';
    wrap.style.animationDuration = L.dur;
    for (const off of [0, H]){
      const s = document.createElement('span');
      s.style.cssText = `width:${L.size}px;height:${L.size}px;top:${off}px;box-shadow:${shadow}`;
      wrap.appendChild(s);
    }
    sky.appendChild(wrap);
  }

  /* 떠다니는 것들. 음수 delay를 줘서 시작하자마자 화면 여기저기 흩어져 있게 함.
     멀리 있을수록 작고 흐리고 느리게 — 크기·속도·blur를 같이 묶어야 거리감이 남 */
  const rnd = (a, b) => a + Math.random()*(b - a);
  const add = (emoji, o) => {
    const outer = document.createElement('div');
    outer.className = 'drift';
    outer.style.cssText =
      `top:${o.top}%; font-size:${o.size}px; opacity:${o.op}; filter:blur(${o.blur}px);` +
      `animation-duration:${o.dur}s; animation-delay:${-o.delay}s; --dy:${o.dy}vh`;
    const inner = document.createElement('div');
    inner.className = 'tumble';
    inner.style.animationDuration = o.spin + 's';
    if (Math.random() < .5) inner.style.animationDirection = 'reverse';
    inner.textContent = emoji;
    outer.appendChild(inner);
    sky.appendChild(outer);
  };

  for (let i = 0; i < 7; i++){
    const far = Math.random();           // 0이면 멀리, 1이면 가까이
    add('🪨', {
      top: rnd(4, 92), size: 14 + far*32, op: .35 + far*.4, blur: 1.6 - far*1.6,
      dur: 190 - far*110, delay: rnd(0, 190), dy: rnd(-16, 16), spin: rnd(20, 55),
    });
  }
  add('☄️',   { top: rnd(6, 26),  size: 28, op:.75, blur:.2, dur: 58,  delay: rnd(0,58),  dy: 24,  spin: 140 });
  add('🛰️',   { top: rnd(58, 78), size: 26, op:.7,  blur:.2, dur: 130, delay: rnd(0,130), dy: -9,  spin: 95 });
  add('🧑‍🚀', { top: rnd(28, 62), size: 42, op:.95, blur:0,  dur: 115, delay: rnd(0,115), dy: 12,  spin: 28 });
})();

/* 3×3을 실제 20칸 판 위에 얹어 계산한다 — 인접 판정이 본 게임과 완전히 같아야 하니까 */
const MINI_CELLS = [1,2,3, 6,7,8, 11,12,13];      // 5×4 판에서 가운데 3×3
function buildMini(id){
  const m = MINI[id] || {};
  const cells = makeCells(), deck = [];
  const put = (idx, sid, mem) => {
    const en = mkEntry(sid);
    if (mem) Object.assign(en.mem, mem);
    deck.push(en); cells[idx].entry = en; cells[idx].val = baseOf(en);
    return en;
  };
  // 가운데
  put(MINI_CELLS[4], id, m.mem);
  // 이웃 — 따로 안 적었으면 "엮이는 심볼"에서 자동으로 가져온다
  let ring = m.ring;
  if (!ring){
    const r = relatedOf(id);
    ring = r.selfRef ? [id, id, id] : r.ids.slice(0, 3);
  }
  const around = [MINI_CELLS[1], MINI_CELLS[3], MINI_CELLS[5], MINI_CELLS[7],
                  MINI_CELLS[0], MINI_CELLS[2], MINI_CELLS[6], MINI_CELLS[8]];
  ring.forEach((sid, i) => { if (around[i] != null) put(around[i], sid, m.memAll); });
  (m.row  || []).forEach((sid, i) => put([MINI_CELLS[3], MINI_CELLS[5]][i] ?? MINI_CELLS[0], sid));
  (m.col  || []).forEach((sid, i) => put([MINI_CELLS[1], MINI_CELLS[7]][i] ?? MINI_CELLS[2], sid));
  (m.plus || []).forEach((sid, i) => put([MINI_CELLS[1], MINI_CELLS[3], MINI_CELLS[5]][i], sid));
  (m.deck || []).forEach(sid => deck.push(mkEntry(sid)));

  const base = cells.map(c => c.entry ? baseOf(c.entry) : 0);
  resolve({ cells, deck, debt:{ mul:1, add:0 } }, () => 0.5);
  return { cells, base, center: cells[MINI_CELLS[4]], note: m.note, deck };
}

function miniHTML(id){
  const y = SYMBOLS[id];
  const { cells, base, center, note, deck } = buildMini(id);
  const lit = {}; lit[center.i] = 1;
  center.links.forEach(l => { lit[l.i] = 2; });

  const grid = '<div class="mgrid">' + MINI_CELLS.map(i => {
    const c = cells[i];
    if (!c.entry) return '<i class="dcell empty"></i>';
    const on = c.i === center.i, rel = !on && lit[c.i] === 2;
    return `<i class="dcell${on?' on':''}${rel?' rel':''}">
      <b>${SYMBOLS[c.entry.id].e}</b><u>${c.val > 0 ? '+' : ''}${c.val}</u></i>`;
  }).join('') + '</div>';

  const b = base[center.i], gain = center.val - b;
  const range = scopeOf(y.d) || '⬚ 인접 8칸';
  const rel = relatedOf(id);

        ${gain !== 0 ? `<div class="row"><span>효과</span><span>${gain > 0 ? '+' : ''}${gain}</span></div>` : ''}
        <div class="row sum"><span>이 칸의 값</span><span>${center.val}</span></div>

    </div>
  </div>`;
}

    d:'화물은 열기 전까지 0이지만 등장할 때마다 안이 +12씩 불어난다. 참을수록 커지는 덱.' },
];

function deckHTML(d){
  const cells = makeCells(), deck = [];
  d.fill.forEach((id, i) => {
    const en = mkEntry(id);
    if (id === 'cargo') en.mem.acc = 48;          // 몇 번 등장해 불어난 상태로 보여줌
    if (id === 'bloom') en.mem.grow = 8;
    deck.push(en); cells[i].entry = en; cells[i].val = baseOf(en);
  });
  (d.extra || []).forEach(id => deck.push(mkEntry(id)));
  const res = resolve({ cells, deck, debt:{ mul:1, add:0 } }, () => 0.5);
  const sum = cells.reduce((a,c) => a + (c.entry && !c.dead ? c.val : 0), 0);

  const grid = '<div class="dgrid">' + cells.map(c =>
    c.entry ? `<i class="dcell"><b>${SYMBOLS[c.entry.id].e}</b><u>${c.val > 0 ? '+' : ''}${c.val}</u></i>`
            : '<i class="dcell empty"></i>').join('') + '</div>';

  return `<div class="mttl">${d.t} <em style="color:var(--legend)">${d.lv}</em></div>
    <p>${d.d}</p>
    <p>핵심 심볼 ${symRow(d.core)}</p>
    ${grid}
    <div class="calc">
      <div class="row"><span>칸 값을 전부 더하면</span><span>${sum}</span></div>
      <div class="row"><span>순도 ${res.purityTop}/${res.filled} (${Math.round(res.purityTop/res.filled*100)}%)</span><span>× ${res.purity}</span></div>
      <div class="row sum"><span>이 판의 한 스핀</span><span>${res.total}</span></div>
    </div>`;
}

// ── 탭
let guidePage = 0, miniId = 'ration', deckIdx = 0;

const GUIDE_PAGES = [
  { k:'기본', t:'한 판이 어떻게 굴러가나', html: () => `

    <table>
      <tr><th>화물칸</th><th>한 장이 판에 나올 확률</th></tr>
      <tr><td class="num">20장</td><td class="num">100%</td></tr>
      <tr><td class="num">30장</td><td class="num">67%</td></tr>

  { k:'심볼 배우기', t:'', mini:true },

    <table>

      <tr><td><b>← → ↑ ↓</b></td><td>선택지 이동</td></tr>

       <b>4구역쯤</b> 손에 들어온 걸 보고 축을 하나 정한다.<br>
       <b>그 뒤로는</b> 축 밖을 넘기고, 정비로 시작 덱을 밀어내며 순도를 올린다.</p>` },
];

function renderMini(){
  const ids = Object.keys(SYMBOLS).filter(id => !SYMBOLS[id].noOffer || id === 'bud');
  const byR = { common:[], uncommon:[], rare:[], legend:[] };
  ids.forEach(id => byR[SYMBOLS[id].r].push(id));
  $('#gbody').innerHTML = `<h3>심볼 배우기</h3>
    <p class="lead">심볼을 누르면 그 심볼 하나만 놓고 <b>실제 엔진으로 계산한</b> 3×3 예시가 뜬다.</p>
    <div class="mpick">
      ${Object.keys(byR).map(r => `<div class="mgrp"><span style="color:${RARITY[r].color}">${RARITY[r].label}</span>
        ${byR[r].map(id => `<button data-mini="${id}" class="${id===miniId?'on':''}" title="${SYMBOLS[id].n}">${SYMBOLS[id].e}</button>`).join('')}
      </div>`).join('')}
    </div>
    ${miniHTML(miniId)}`;
}

function renderDeckTab(){
  $('#gbody').innerHTML = `<h3>덱 형태</h3>
    <p class="lead">완성했을 때 판이 어떻게 보이는지와, 그때 한 스핀이 얼마인지. <b>전부 실제 계산값</b>이다.</p>
    <div class="mpick"><div class="mgrp">
      ${DECKS.map((d,i) => `<button data-deck="${i}" class="wide ${i===deckIdx?'on':''}">${d.t}</button>`).join('')}
    </div></div>
    ${deckHTML(DECKS[deckIdx])}`;
}

function renderGuide(){
  $('#gtabs').innerHTML = GUIDE_PAGES.map((p,i) =>
    `<button data-i="${i}" class="${i===guidePage?'on':''}">${p.k}</button>`).join('');
  const p = GUIDE_PAGES[guidePage];
  if (p.mini)      renderMini();
  else if (p.deck) renderDeckTab();
  else             $('#gbody').innerHTML = `<h3>${p.t}</h3>` + p.html();
  $('#gbody').scrollTop = 0;
}

$('#gtabs').onclick = ev => {
  const b = ev.target.closest('button[data-i]');
  if (!b) return;
  guidePage = +b.dataset.i; renderGuide(); beep(700, .03, 'sine', .03);
};
$('#gbody').addEventListener('click', ev => {
  const m = ev.target.closest('[data-mini]');
  if (m){ miniId = m.dataset.mini; renderMini(); beep(680,.03,'sine',.03); return; }
  const d = ev.target.closest('[data-deck]');
  if (d){ deckIdx = +d.dataset.deck; renderDeckTab(); beep(680,.03,'sine',.03); }
});

const guide = $('#guide');
let guideTimer = 0;
function toggleGuide(on){
  const next = on === undefined ? !guide.classList.contains('on') : on;
  clearTimeout(guideTimer); guideTimer = 0;      // 닫는 중이었으면 취소하고 다시 연다
  if (next){
    renderGuide();
    guide.classList.add('on');
    void guide.offsetWidth;            // 리플로우를 강제해야 트랜지션이 탄다
    guide.classList.add('show');
  } else {
    guide.classList.remove('show');
    guideTimer = setTimeout(() => { guide.classList.remove('on'); guideTimer = 0; }, 200);
    if (guideFromHome){ guideFromHome = false; showHome(true); }
  }
}
$('#guideBtn').onclick   = () => toggleGuide(true);
$('#guideClose').onclick = () => toggleGuide(false);
$('#guideSkip').onclick  = () => toggleGuide(false);
guide.onclick = ev => { if (ev.target === guide) toggleGuide(false); };

// ══════════════════════════════════ 홈 화면
/* 게임은 뒤에서 이미 초기화돼 있고 홈은 그 위에 덮인 막이다.
   그래서 "계속하기"는 막을 걷기만 하면 판이 그대로 이어진다 */
const home = $('#home');
let guideFromHome = false;

function inProgress(){
  return game && (game.round > 1 || game.paidTotal > 0 || game.spinsLeft < spinsFor(1));
}
let homeTimer = 0;
function showHome(on){
  /* 닫는 중이면 예약된 뒷정리를 취소하고 연다.
     안 그러면 280ms 뒤에 타이머가 터져 방금 연 화면의 on을 떼어버린다
     (display:none인데 show만 남아 아무것도 안 보이는 상태가 됨) */
  clearTimeout(homeTimer); homeTimer = 0;
  if (on){
    $('#hBest').textContent = best();
    $('#hResume').style.display = inProgress() ? '' : 'none';
    $('#hStart').textContent = inProgress() ? '↻ 새 항해' : '▶ 항해 시작';
    $('#hMute').textContent = muted ? '🔇 소리 켜기' : '🔊 소리 끄기';
    home.classList.add('on');
    void home.offsetWidth;
    home.classList.add('show');
  } else {
    home.classList.remove('show');
    homeTimer = setTimeout(() => { home.classList.remove('on'); homeTimer = 0; }, 280);
  }
}
$('#hResume').onclick = () => showHome(false);
$('#hStart').onclick  = () => { newGame(); showHome(false); beep(560,.07,'triangle',.05); };
$('#hGuide').onclick  = () => { guideFromHome = true; showHome(false); toggleGuide(true); };
$('#hMute').onclick   = ev => {
  muted = !muted;
  store.set('oxy.muted', muted ? '1' : '0');
  $('#muteBtn').textContent = muted ? '🔇' : '🔊';
  ev.currentTarget.textContent = muted ? '🔇 소리 켜기' : '🔊 소리 끄기';
  if (!muted) beep(660, .06, 'sine', .04);
};
$('#homeBtn').onclick = () => showHome(true);

/* 화면 모드 — 네온이 너무 튈 때를 위한 평면 버전.
   캔버스 색은 CSS가 못 건드리니 skin 객체를 같이 갈아준다 */
let simpleMode = store.get('oxy.skin') !== 'neon';
function applySkin(){
  document.body.classList.toggle('simple', simpleMode);
  skin = simpleMode ? SKINS.simple : SKINS.neon;
  $('#skinBtn').textContent = simpleMode ? '◻︎ 심플' : '✨ 네온';
  draw();
}
$('#skinBtn').onclick = () => {
  simpleMode = !simpleMode;
  store.set('oxy.skin', simpleMode ? 'simple' : 'neon');
  applySkin();
  beep(simpleMode ? 420 : 760, .05, 'sine', .04);
};

// ══════════════════════════════════ 입력
/* 화물칸 서랍. 슬롯머신을 화면 정중앙에 두려고 상시 패널에서 뺐음 */
const cargo = $('#cargo');
const toggleCargo = on => {
  const next = on === undefined ? !cargo.classList.contains('open') : on;
  cargo.classList.toggle('open', next);
  beep(next ? 520 : 380, .05, 'triangle', .04);
};
$('#cargoBtn').onclick   = () => toggleCargo();
$('#cargoClose').onclick = () => toggleCargo(false);

const lever = $('#lever');
async function pullLever(){
  if (lever.classList.contains('off')) return;
  lever.classList.remove('fresh');            // 한 번 당기면 유도 애니메이션은 끝
  lever.classList.add('pulled');
  beep(90, .09, 'square', .05);                                  // 물리는 소리
  setTimeout(() => { lever.classList.remove('pulled');           // 튕겨 올라옴
                     beep(150, .06, 'triangle', .035); }, 210 / speed);
  await spin();
}
lever.onclick = pullLever;

$('#resetBtn').onclick = () => { if (!busy) newGame(); };
const SPEEDS = [1, 1.5, 2];
const showSpeed = () => { $('#speedRead').textContent = speed.toFixed(1); };
showSpeed();
$('#speedBtn').onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  store.set('oxy.speed', String(speed));
  showSpeed();
  beep(880, .04, 'square', .04);
};
$('#muteBtn').textContent = muted ? '🔇' : '🔊';
$('#muteBtn').onclick  = ev => {
  muted = !muted;
  store.set('oxy.muted', muted ? '1' : '0');
  ev.currentTarget.textContent = muted ? '🔇' : '🔊';
  if (!muted) beep(660, .06, 'sine', .04);
};
document.addEventListener('keydown', ev => {
  const blocked = $('#overlay').classList.contains('on')
               || home.classList.contains('on')
               || guide.classList.contains('on');
  if (ev.code === 'Space'){ ev.preventDefault(); if (!blocked) pullLever(); }
  if ((ev.key === 'c' || ev.key === 'C') && !blocked) toggleCargo();
  if ((ev.key === 's' || ev.key === 'S') && !blocked) $('#skinBtn').click();
  if (ev.key === 'h' || ev.key === 'H') toggleGuide();
  if (ev.key === 'Escape'){ toggleGuide(false); toggleCargo(false); if (inProgress()) showHome(false); }
});

newGame();
applySkin();       // 판이 선 뒤에 칠한다 — draw()가 game을 읽으므로
showHome(true);    // 들어오면 홈부터
</script>
</body>
</html>
